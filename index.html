<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d1c">
  <title>Nyra — AI by AstropicAI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: Inter, system-ui, Arial, sans-serif;
      color: #eef5ff;
      background: radial-gradient(ellipse at top, #18254b 0, #0b1020 45%, #060914 100%);
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 22px 7%; border-bottom: 1px solid #263451;
    }
    .brand { font-size: 21px; font-weight: 800; letter-spacing: 3px; }
    .brand span { color: #70d9ff; }
    .status { color: #91e8c1; font-size: 13px; }
    main { width: min(850px, 92%); margin: 65px auto; text-align: center; }
    .orb {
      width: 100px; height: 100px; margin: 0 auto 25px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #b9f5ff, #4c7cff 40%, #8c45f5 72%, #17152e);
      box-shadow: 0 0 65px #517bff66;
    }
    h1 { font-size: clamp(42px, 8vw, 70px); margin: 0; letter-spacing: -2px; }
    h1 span {
      background: linear-gradient(90deg, #86e6ff, #a99bff);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .subtitle { color: #aab8d5; line-height: 1.7; margin: 18px auto 32px; max-width: 570px; }
    .suggestions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 24px 0; }
    .suggestions button {
      background: #111a30; color: #dce8ff; border: 1px solid #344464;
      padding: 11px 15px; border-radius: 20px; cursor: pointer;
    }
    .suggestions button:hover { border-color: #7bdcff; }
    .chat {
      text-align: left; background: #0d1426cc; border: 1px solid #2c3b59;
      border-radius: 20px; padding: 18px; margin-top: 24px;
    }
    #messages { max-height: 330px; overflow-y: auto; }
    .message { padding: 12px 14px; margin: 10px 0; border-radius: 12px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
    .nyra { background: #17223b; color: #e0eaff; }
    .user { background: #26345a; margin-left: 12%; }
    form { display: flex; gap: 10px; margin-top: 15px; }
    input {
      min-width: 0; flex: 1; padding: 15px; border-radius: 12px;
      background: #080d1b; border: 1px solid #344464; color: white; font-size: 15px;
    }
    form button {
      padding: 0 20px; border: 0; border-radius: 12px;
      color: #08101e; background: #8ce6ff; font-weight: 800; cursor: pointer;
    }
    .note { color: #8494b4; font-size: 12px; margin-top: 18px; }
    footer { text-align: center; color: #7786a5; padding: 25px; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">ASTROPIC<span>AI</span></div>
    <div class="status">● NYRA DEVELOPMENT</div>
  </header>
  <main>
    <div class="orb" aria-hidden="true"></div>
    <h1>Meet <span>Nyra.</span></h1>
    <p class="subtitle">Your AI partner for thinking bigger, planning smarter, and moving from ideas to action.</p>
    <div class="suggestions">
      <button type="button" data-prompt="Help me plan a new project">Plan a project</button>
      <button type="button" data-prompt="Help me research a business idea">Explore an idea</button>
      <button type="button" data-prompt="Create a step-by-step action plan for my goal">Build an action plan</button>
    </div>
    <section class="chat" aria-label="Nyra chat">
      <div id="messages" aria-live="polite">
        <div class="message nyra"><strong>NYRA</strong><br>Hello! I'm Nyra, your AI companion from AstropicAI. Tell me what you'd like to accomplish, and we'll work through it together.</div>
      </div>
      <form id="chatForm">
        <input id="prompt" aria-label="Your message" placeholder="Tell Nyra what you want to achieve..." autocomplete="off" required>
        <button type="submit">Send ↗</button>
      </form>
    </section>
  </main>
  <footer>NYRA · An AstropicAI project</footer>
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  
const API = "/nyra/api/chat";

const messagesBox = document.getElementById("messages");
const form = document.getElementById("chatForm");
const input = document.getElementById("prompt");
const sendButton = form.querySelector('button[type="submit"]');

let supabaseClient;
let session;
let conversationId = localStorage.getItem("nyra_conversation_id");

function addMessage(content, role) {
  const div = document.createElement("div");
  div.className = "message " + (role === "user" ? "user" : "nyra");
  div.textContent = content;
  messagesBox.appendChild(div);
  messagesBox.scrollTop = messagesBox.scrollHeight;
}

async function initializeNyra() {
  const configResponse = await fetch(API);
  if (!configResponse.ok) throw new Error("Configuration failed");

  const config = await configResponse.json();

  supabaseClient = window.supabase.createClient(
    config.supabaseUrl,
    config.supabaseAnonKey
  );

  const existing = await supabaseClient.auth.getSession();
  session = existing.data.session;

  if (!session) {
    const result = await supabaseClient.auth.signInAnonymously();
    if (result.error) throw result.error;
    session = result.data.session;
  }

  if (conversationId) {
    const response = await fetch(API, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + session.access_token
      },
      body: JSON.stringify({
        action: "load",
        conversationId
      })
    });

    const data = await response.json();

    if (response.ok && data.messages) {
      data.messages.forEach(item => {
        addMessage(item.content, item.role);
      });
    } else {
      conversationId = null;
      localStorage.removeItem("nyra_conversation_id");
    }
  }
}

form.addEventListener("submit", async event => {
  event.preventDefault();

  const message = input.value.trim();
  if (!message || !session) return;

  addMessage(message, "user");
  input.value = "";
  sendButton.disabled = true;

  try {
    const response = await fetch(API, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + session.access_token
      },
      body: JSON.stringify({
        message,
        conversationId
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Request failed");
    }

    conversationId = data.conversation_id;
    localStorage.setItem("nyra_conversation_id", conversationId);

    addMessage(data.reply, "nyra");

  } catch (error) {
    addMessage("Connection error: " + error.message, "nyra");
  } finally {
    sendButton.disabled = false;
    input.focus();
  }
});

initializeNyra().catch(error => {
  console.error("Nyra initialization error:", error);
  addMessage("Nyra could not connect. Please refresh and try again.", "nyra");
});

</script>
</body>
</html>
